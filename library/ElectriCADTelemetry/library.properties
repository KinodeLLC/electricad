name=ElectriCADTelemetry
version=0.7.0
author=ElectriCAD
maintainer=ElectriCAD
sentence=Streams live pin state to the ElectriCAD IDE board view.
paragraph=Reads the hardware registers directly (any AVR via the core pin tables, ESP32, ESP8266, RP2040, SAMD, UNO R4) and emits a compact snapshot line over Serial: pin modes, levels, pull-ups, PWM duty and analog values. ELECTRICAD_BEGIN() in setup, ELECTRICAD_TICK() in loop, ELECTRICAD_DELAY(ms) for live waits, ELECTRICAD_I2C_SCAN(Wire) for the I2C panel, ELECTRICAD_NEOPIXEL(strip) for onboard RGB LEDs. The UNO R4 WiFi LED matrix is sent automatically.
category=Communication
architectures=avr,megaavr,esp32,esp8266,rp2040,samd,renesas_uno
